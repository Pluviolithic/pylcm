[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.7,<0.11" ]

[project]
name = "plcm"
version = "0.0.0a4"
description = "Alternative, pure-python implementation of lcm."
readme = "README.md"
license = "MIT"
license-files = [ "LICEN[CS]E*" ]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typing-extensions>=4.15",
]
urls.Homepage = "https://github.com/Pluviolithic/pylcm"
urls.Issues = "https://github.com/Pluviolithic/pylcm/issues"

[project.scripts]
spy = "plcm.tools.spy:main"

[project.optional-dependencies]
ui = []

[dependency-groups]
dev = [
    "lcm>=1.5.2",
    "pyproject-fmt>=2.24.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "ty>=0.0.49",
    "uv>=0.11.21",
]

[tool.ruff]
preview = true
lint.select = [ "ALL" ]
lint.ignore = [ "COM812", "CPY", "D101", "EM", "FIX002", "TD002", "TRY" ]
lint.per-file-ignores."tests/**.py" = [ "D", "INP", "S" ]
lint.isort.combine-as-imports = true
lint.pydocstyle.convention = "google"
